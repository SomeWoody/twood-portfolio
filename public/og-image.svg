<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2d48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Tech circuit lines -->
  <line x1="0" y1="100" x2="300" y2="100" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
  <line x1="900" y1="530" x2="1200" y2="530" stroke="#14b8a6" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="300" x2="150" y2="300" stroke="#14b8a6" stroke-width="1.5" opacity="0.3"/>
  <line x1="1050" y1="350" x2="1200" y2="350" stroke="#14b8a6" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Tech dots -->
  <circle cx="300" cy="100" r="5" fill="#14b8a6" opacity="0.6"/>
  <circle cx="1200" cy="530" r="5" fill="#14b8a6" opacity="0.6"/>
  <circle cx="150" cy="300" r="4" fill="#14b8a6" opacity="0.4"/>
  <circle cx="1050" cy="350" r="4" fill="#14b8a6" opacity="0.4"/>
  
  <!-- Shield icon (security) -->
  <g transform="translate(1050, 100)">
    <path d="M 0 0 L 35 5 L 35 25 Q 35 40 0 50 Q -35 40 -35 25 L -35 5 Z" 
          fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="25" r="8" fill="#14b8a6" opacity="0.5"/>
  </g>
  
  <!-- Main content area - accent line -->
  <rect x="0" y="180" width="1200" height="270" fill="url(#accentGradient)" opacity="0.1"/>
  
  <!-- Name -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        text-anchor="middle" fill="#f1f5f9">
    Tyler Wood
  </text>
  
  <!-- Title -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="42" font-weight="300"
        text-anchor="middle" fill="#14b8a6">
    Enterprise Cybersecurity Leader
  </text>
  
  <!-- Tagline -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="24"
        text-anchor="middle" fill="#cbd5e1">
    10 Years | Security Operations | Tulsa, Oklahoma
  </text>
  
  <!-- Bottom accent line -->
  <line x1="200" y1="480" x2="1000" y2="480" stroke="#14b8a6" stroke-width="2" opacity="0.5"/>
  
  <!-- Bottom tech elements -->
  <circle cx="200" cy="480" r="6" fill="#14b8a6" opacity="0.7"/>
  <circle cx="1000" cy="480" r="6" fill="#14b8a6" opacity="0.7"/>
  
  <!-- Website URL -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20"
        text-anchor="middle" fill="#94a3b8">
    twood.org
  </text>
</svg>